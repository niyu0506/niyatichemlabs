# ═══════════════════════════════════════════════════════════════════════════
#  Photo gallery — drives /gallery/
#
#  To add a photo: put the image file in  static/img/gallery/  (or anywhere
#  under static/img/) and add a "- src / caption" line to the right group.
#  To add a new group, copy a whole "- title / blurb / photos" block.
#
#  `src` is the path underneath  static/  — e.g. an image saved as
#  static/img/gallery/warehouse-1.jpg  is written  img/gallery/warehouse-1.jpg
#
#  NOTE: the pack shots below still carry the old Panacea label artwork and
#  should be replaced with re-shot Niyati photographs before launch.
# ═══════════════════════════════════════════════════════════════════════════

