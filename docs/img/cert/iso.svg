  <text x="300" y="446" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif"
        font-size="19" fill="#5c716a">Niyati Chem Labs</text>

  <line x1="150" y1="486" x2="450" y2="486" stroke="#d9e3de" stroke-width="1.5"/>

  <text x="300" y="530" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif"
