  <rect x="176" y="612" width="248" height="46" rx="23" fill="#eefaf4" stroke="#ade4cd" stroke-width="1.5"/>
  <text x="300" y="641" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif"
