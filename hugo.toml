# ═══════════════════════════════════════════════════════════════════════════
#  Niyati Chem Labs — site configuration
#
#  Most things you'd want to change day-to-day live under [params] below:
#  phone number, email, address, and the headline text on the home page.
#  See HOW-TO-EDIT.md for a plain-English guide.
# ═══════════════════════════════════════════════════════════════════════════

baseURL = "https://keivan-shah.github.io/niyatichemlabs/"
languageCode = "en-in"
title = "Niyati Chem Labs"
publishDir = "docs"          # GitHub Pages serves the site from this folder
enableRobotsTXT = true
enableEmoji = true

[pagination]
  pagerSize = 24

# We don't use tags/categories taxonomy pages — this stops Hugo generating empty ones.
[taxonomies]

[markup.goldmark.renderer]
  unsafe = true              # allows raw HTML inside .md files

[markup.highlight]
  noClasses = false

# ── Navigation bar ─────────────────────────────────────────────────────────
# To add a new item, either add an entry here OR put `menus: main` in the
# front matter of any page. Lower `weight` = further left.
[menus]
  [[menus.main]]
    name = "Home"
    pageRef = "/"
    weight = 10

  [[menus.main]]
    name = "About Us"
    pageRef = "/about"
    weight = 20

  [[menus.main]]
    name = "Products"
    pageRef = "/products"
    weight = 30

  [[menus.main]]
    name = "Certification"
    pageRef = "/certification"
    weight = 40

  [[menus.main]]
    name = "Contact"
    pageRef = "/contact"
    weight = 50

# ── Site-wide details ──────────────────────────────────────────────────────
[params]
  company     = "Niyati Chem Labs"
  legalName   = "Niyati Chem Labs"
  tagline     = "Manufacturer & Exporter of Herbal Ayurvedic Formulations"
  description = "Niyati Chem Labs is a GMP & ISO certified Indian manufacturer and exporter of herbal ayurvedic capsules, tablets, oils and powders, offering third-party and contract manufacturing."
  established = "2012"

  phone       = "+91 98765 43210"
  phoneAlt    = "+91 98765 43211"
  email       = "hi@niyatichemlabs.in"
  whatsapp    = "919876543210"        # digits only, for the wa.me link

  [params.address]
    unit1Label = "Registered Office"
    unit1 = "102 Trinity Industrial Park, NH-08, Bapane, Naigaon East, Vasai — 401208, Dist. Palghar, Maharashtra, India"
    unit2Label = "Manufacturing Unit"
    unit2 = "122/C-3, Kabilpore, Navsari, Gujarat — 396424, India"

  # Numbers shown in the stats strip on the home page
  [[params.stats]]
    value = "12+"
    label = "Years of experience"
  [[params.stats]]
    value = "27"
    label = "Products in catalogue"
  [[params.stats]]
    value = "3"
    label = "Continents served"
  [[params.stats]]
    value = "100%"
    label = "In-house QC tested"

  # Disclaimer shown in the footer
  disclaimer = "Information and statements about the products on this site have not been evaluated by the Food and Drug Administration and are not intended to diagnose, treat, cure or prevent any disease."

# ── Product categories ─────────────────────────────────────────────────────
# The `key` must match the `category` field in each product's .md file.
[[params.categories]]
  key   = "capsules"
  name  = "Capsules"
  icon  = "flask"
  blurb = "Herbal and single-herb extract capsules in HPMC and gelatin shells."
[[params.categories]]
  key   = "tablets"
  name  = "Tablets"
  icon  = "package"
  blurb = "Coated and uncoated ayurvedic formulation tablets."
[[params.categories]]
  key   = "oils"
  name  = "Oils"
  icon  = "leaf"
  blurb = "Ayurvedic massage and hair oils, cold-processed and filtered."
[[params.categories]]
  key   = "other"
  name  = "Churna & Powders"
  icon  = "sparkles"
  blurb = "Classical churna preparations and blended herbal powders."

[outputs]
  home = ["HTML", "RSS", "SITEMAP"]
