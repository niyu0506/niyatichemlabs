  blurb    = "Active pharmaceutical ingredients and intermediates, sourced against your specification."
[[params.categories]]
  key      = "excipient"
  division = "raw-materials"
  name     = "Excipients"
  icon     = "microscope"
  blurb    = "Binders, fillers, disintegrants and processing aids for oral solid dosage forms."
[[params.categories]]
  key      = "capsules"
  division = "formulations"
  name     = "Capsules"
  icon     = "package"
  blurb    = "Herbal and single-herb extract capsules in HPMC and gelatin shells."
[[params.categories]]
  key      = "tablets"
  division = "formulations"
  name     = "Tablets"
  icon     = "package"
  blurb    = "Coated and uncoated ayurvedic formulation tablets."
[[params.categories]]
  key      = "syrups"
  division = "formulations"
  name     = "Syrups"
  icon     = "flask"
  blurb    = "Ayurvedic and herbal syrups, filled and labelled under your own brand."
[[params.categories]]
  key      = "oils"
  division = "formulations"
  name     = "Oils"
  icon     = "leaf"
