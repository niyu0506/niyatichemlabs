# ═══════════════════════════════════════════════════════════════════════════
#  Niyati Chemlabs — site configuration
#
#  Most things you'd want to change day-to-day live under [params] below:
#  phone number, email, address, and the headline text on the home page.
#  See HOW-TO-EDIT.md for a plain-English guide.
# ═══════════════════════════════════════════════════════════════════════════

baseURL = "https://keivan.in/niyatichemlabs/"
languageCode = "en-in"
title = "Niyati Chemlabs"
publishDir = "docs"          # GitHub Pages serves the site from this folder
enableRobotsTXT = true
enableEmoji = true

[pagination]
  pagerSize = 24

# We don't use tags/categories taxonomy pages — this stops Hugo generating empty ones.
[taxonomies]

[markup.goldmark.renderer]
  unsafe = true              # allows raw HTML inside .md files

[markup.highlight]
  noClasses = false

# ── Navigation bar ─────────────────────────────────────────────────────────
# To add a new item, either add an entry here OR put `menus: main` in the
# front matter of any page. Lower `weight` = further left.
[menus]
  [[menus.main]]
    name = "Home"
    pageRef = "/"
    weight = 10

  [[menus.main]]
    name = "About Us"
    pageRef = "/about"
    weight = 20

  [[menus.main]]
    name = "Products"
    pageRef = "/products"
    weight = 30

  [[menus.main]]
    name = "Quality"
    pageRef = "/certification"
    weight = 40

  [[menus.main]]
    name = "Enquiry"
    pageRef = "/enquiry"
    weight = 45

  [[menus.main]]
    name = "Gallery"
    pageRef = "/gallery"
    weight = 47

  [[menus.main]]
    name = "Contact Us"
    pageRef = "/contact"
    weight = 50

# ── Site-wide details ──────────────────────────────────────────────────────
[params]
  company     = "Niyati Chemlabs"
  legalName   = "Niyati Chemlabs"
  brandSub    = "Experience Quality"
  tagline     = "Suppliers of APIs, Nutraceutical Ingredients & Herbal Formulations"
  description = "Niyati Chemlabs supplies active pharmaceutical ingredients, nutraceutical raw materials and finished herbal formulations to manufacturers and brand owners across India."

  phone       = "+91 70457 17020"
  email       = "niyatichemlabs@gmail.com"
  whatsapp    = "917045717020"        # digits only, for the wa.me link

  fssai       = "11523011000215"      # FSSAI licence number, printed on our packs

  # ── Enquiry form ─────────────────────────────────────────────────────────
  # The site is static, so the form needs an outside service to deliver the
  # email. We use Web3Forms (free): go to https://web3forms.com, type
  # niyatichemlabs@gmail.com into the box, and they email you an access key.
  # Paste that key below and the form starts working — nothing else to change.
  #
  # Until a key is pasted in, the Enquiry page shows the WhatsApp/email/phone
  # buttons instead of a form that would silently go nowhere.
  formEndpoint  = "https://api.web3forms.com/submit"
  formAccessKey = "fbfe71c6-dde0-4b99-bcfb-5b326c30622f"
  formSubject   = "New enquiry from niyatichemlabs.in"

  # Disclaimer shown in the footer
  disclaimer = "Information and statements about the products on this site have not been evaluated by the Food Safety and Standards Authority of India or the Food and Drug Administration, and are not intended to diagnose, treat, cure or prevent any disease. Product specifications are indicative — refer to the certificate of analysis supplied with each consignment."

  [params.address]
    unit1Label = "Registered Office"
    unit1 = "M/404, Panchsheel Gardens, Mahavir Nagar, Kandivali West, Mumbai — 400067"

    # Exact pin for the map and the "Get directions" link. Searching by address
    # alone landed in the wrong place, so the coordinates win when they're set.
    # To change them: open the spot in Google Maps, right-click it, and click
    # the latitude/longitude at the top of the menu to copy it.
    mapLat = "19.2108397"
    mapLng = "72.8402699"

    # Fallback, used only if the two lines above are left blank
    mapQuery = "M/404 Panchsheel Gardens, Mahavir Nagar, Kandivali West, Mumbai 400067"

    # How tightly the map is zoomed in: higher is closer. 15 = neighbourhood,
    # 17 = a few streets, 19 = individual buildings.
    mapZoom = "17"

  # Numbers shown in the stats strip. Non-numeric values are displayed as-is.
  [[params.stats]]
    value = "FSSAI"
    label = "Licensed & registered"
  [[params.stats]]
    value = "100%"
    label = "Non-GMO sourcing"
  [[params.stats]]
    value = "COA"
    label = "With every consignment"
  [[params.stats]]
    value = "1 kg+"
    label = "Sample to bulk quantities"

# ── Business divisions ─────────────────────────────────────────────────────
# Each product category below belongs to one of these.
[[params.divisions]]
  key   = "raw-materials"
  name  = "Raw Material"
  long  = "Raw Materials & APIs"
  url   = "products/raw-materials/"
  icon  = "flask"
  blurb = "Active pharmaceutical ingredients, vitamins, nutraceutical actives and functional raw materials, supplied to specification with full documentation."
[[params.divisions]]
  key   = "formulations"
  name  = "Finished Dosage Formulation"
  long  = "Finished Dosage Formulations"
  url   = "products/formulations/"
  icon  = "package"
  hideImages = true      # pack shots are being re-shot — cards show text only
  blurb = "Ready-to-market ayurvedic capsules, tablets, syrups, oils and churna, available under your own label."

# ── Product categories ─────────────────────────────────────────────────────
# The `key` must match the `category` field in each product's .md file.
# A category with no products in it is hidden automatically.
[[params.categories]]
  key      = "nutraceutical"
  division = "raw-materials"
  name     = "Nutraceutical Ingredients"
  short    = "Nutraceutical"
  icon     = "sparkles"
  blurb    = "Protein isolates, extracts and functional ingredients for sports nutrition, fortification and wellness."
