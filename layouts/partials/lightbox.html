<!-- Lightbox -->
<div class="lightbox" id="lightbox" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="lightbox__close" type="button" aria-label="Close">{{ partial "icon.html" (dict "name" "close") }}</button>
  <button class="lightbox__nav lightbox__nav--prev" type="button" aria-label="Previous photo">{{ partial "icon.html" (dict "name" "chevron-left") }}</button>
  <figure class="lightbox__figure">
    <img class="lightbox__img" src="" alt="">
    <figcaption class="lightbox__caption"></figcaption>
  </figure>
  <button class="lightbox__nav lightbox__nav--next" type="button" aria-label="Next photo">{{ partial "icon.html" (dict "name" "chevron-right") }}</button>
</div>
